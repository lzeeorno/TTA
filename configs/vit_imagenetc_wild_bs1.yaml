# ViT-B/16 Wild Scenario: Batch Size = 1
# Extreme low batch size adaptation on ImageNet-C

_BASE_: vit_imagenetc.yaml

dataset:
  batch_size: 1
  num_workers: 0
  shuffle: true  # Wild scenario: shuffled data


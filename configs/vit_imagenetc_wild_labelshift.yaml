# ViT-B/16 Wild Scenario: Label Shift
# Non-IID label distribution (extreme class imbalance) on ImageNet-C

_BASE_: vit_imagenetc.yaml

dataset:
  batch_size: 48
  num_workers: 0
  shuffle: false  # Label shifts use specific imbalanced sampling

optim:
  lr: 0.00001

atlas:
  dig:
    buffer_scenarios: [bs1, mix_shifts]

tta:
  reset_each_corruption: false
  scenario: label_shifts
  imbalance_ratio: 500000  # Extreme class imbalance
